<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origination IMO Finder</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="/config.js"></script>
  <script type="module" src="/src/main.js"></script>
  <style>
    :root { font-family: Aptos, "Segoe UI", sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; padding: 18px; }
    main { max-width: 520px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .hint { color: #526076; margin: 0 0 18px; line-height: 1.4; }
    label { display: block; margin: 12px 0 5px; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #b7c2d2; border-radius: 6px; font: inherit; }
    button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 6px; background: #075ca8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 22px; margin: 14px 0; padding: 10px; border-radius: 6px; background: white; border-left: 4px solid #789; white-space: pre-wrap; }
    #status.error { border-color: #c43131; color: #8a1515; }
    #status.success { border-color: #168044; color: #0f6032; }
    dl { display: grid; grid-template-columns: 82px 1fr; gap: 7px; background: white; padding: 12px; border-radius: 6px; }
    dt { font-weight: 700; } dd { margin: 0; overflow-wrap: anywhere; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Find first origination</h1>
  <p class="hint">Search Outlook by keyword and broker, extract a valid IMO, then start the broker workflow.</p>
  <form id="search-form">
    <label for="keyword">Origination keyword</label>
    <input id="keyword" required value="origination" autocomplete="off">
    <label for="broker">Broker name or email (optional)</label>
    <input id="broker" autocomplete="off" placeholder="Broker Ltd or broker@example.com">
    <button id="run" type="submit">Find IMO and run broker workflow</button>
  </form>
  <div id="status" role="status" aria-live="polite">Ready.</div>
  <dl id="result" hidden>
    <dt>IMO</dt><dd id="result-imo"></dd>
    <dt>Broker</dt><dd id="result-broker"></dd>
    <dt>Received</dt><dd id="result-date"></dd>
    <dt>Subject</dt><dd id="result-subject"></dd>
  </dl>
</main>
</body>
</html>
